<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <ul>
        <li>1</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>8</li>
        <li>10</li>
      </ul>
    </div>

    <script>
      // Way 1 TC O(n^2)
      function findMissingItem() {
        let ul = document.querySelector("ul");
        let list = document.querySelectorAll("li");
        let flag = false;

        for (let i = 0; i < list.length; i++) {
          if (parseInt(list[i].innerText) !== i + 1) {
            console.log(parseInt(list[i].innerText));
            let li = document.createElement("li");
            li.innerHTML = i + 1;
            ul.insertBefore(li, list[i]);
            flag = true;
            break;
          }
        }

        if (flag) {
          findMissingItem();
        }
      }

      findMissingItem();

      // Way 2 TC(n + k)
      function findMissingItem() {
        let ul = document.querySelector("ul");
        let list = document.querySelectorAll("li");
        list = Array.from(list);
        let listNumber = list.map((ele)=> parseInt(ele.innerText));
        console.log(listNumber);
        let min = Math.min(...listNumber);
        let max = Math.max(...listNumber);

        let fragment =document.createDocumentFragment();
        for(let i=min;i<=max;i++){
              let li = document.createElement("li");
              li.innerText = i;
              fragment.append(li);
            
        }
        ul.innerHTML = "";
        ul.append(fragment);
      }

      findMissingItem();
    </script>
  </body>
</html>
